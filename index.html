<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViVi不動産 社内ツールポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-navy:#0E1C2E;
    --panel-navy:#142B45;
    --panel-navy-hover:#1A3552;
    --grid-line: rgba(150, 186, 218, 0.10);
    --grid-line-strong: rgba(150, 186, 218, 0.22);
    --paper:#F3EFE6;
    --paper-dim:#C7D2DE;
    --copper:#C6803F;
    --copper-bright:#E0955A;
    --gold:#D9A94C;
    --muted-blue:#7C97B0;
    --line-thin: rgba(199, 210, 222, 0.18);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:var(--bg-navy);
    color:var(--paper);
    font-family:"Noto Sans JP", sans-serif;
    background-image:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 32px);
    min-height:100vh;
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding: 48px 24px 32px;
  }

  /* ---------- HEADER / TITLE BLOCK ---------- */
  header{
    position:relative;
    border:1px solid var(--line-thin);
    border-radius:2px;
    padding: 36px 32px;
    margin-bottom: 56px;
    background: linear-gradient(180deg, rgba(20,43,69,0.4), rgba(20,43,69,0.05));
  }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:28px;
  }
  .head-text{ flex:1 1 auto; min-width:0; }
  .head-figure{
    flex:0 0 auto;
    width:190px;
    max-width:32%;
    display:block;
    margin-bottom:-36px;
    align-self:flex-end;
    -webkit-mask-image: linear-gradient(180deg, #000 84%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 84%, transparent 100%);
  }

  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    letter-spacing: 0.18em;
    font-size:12px;
    color:var(--copper-bright);
    text-transform:uppercase;
    margin:0 0 14px;
  }

  h1{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:900;
    font-size: clamp(28px, 4.2vw, 44px);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
    color:var(--paper);
  }

  header p.lead{
    font-size:15px;
    color:var(--paper-dim);
    max-width:560px;
    line-height:1.8;
    margin:0;
  }

  .title-block{
    position:absolute;
    right:262px;
    bottom:28px;
    text-align:right;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color:var(--muted-blue);
    line-height:1.9;
    border-left:1px solid var(--line-thin);
    padding-left:16px;
    display:none;
  }

  @media (min-width: 720px){
    .title-block{ display:block; }
  }

  .title-block .row{ display:flex; gap:14px; justify-content:flex-end; }
  .title-block .k{ color:var(--copper-bright); }

  /* ---------- SEARCH ---------- */
  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom: 44px;
    border-bottom:1px solid var(--line-thin);
    padding-bottom: 16px;
  }
  .search-row label{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color:var(--muted-blue);
    letter-spacing:0.1em;
    white-space:nowrap;
  }
  .search-row input{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line-line, var(--line-thin));
    color:var(--paper);
    font-family:"Noto Sans JP", sans-serif;
    font-size:15px;
    padding:6px 4px;
    outline:none;
  }
  .search-row input::placeholder{ color:var(--muted-blue); }
  .search-row input:focus{ border-bottom:1px solid var(--copper-bright); }
  .result-count{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color:var(--muted-blue);
    white-space:nowrap;
  }

  /* ---------- ZONE (CATEGORY) ---------- */
  .zone{ margin-bottom: 52px; }

  .zone-divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 22px;
  }
  .zone-tag{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.08em;
    color:var(--bg-navy);
    background:var(--gold);
    padding:4px 9px 3px;
    border-radius:2px;
    flex-shrink:0;
  }
  .zone-title{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--paper);
    white-space:nowrap;
  }
  .zone-line{
    flex:1;
    height:1px;
    background:
      linear-gradient(90deg, var(--line-thin) 0 8px, transparent 8px 16px) repeat-x;
    background-size: 16px 1px;
    position:relative;
  }
  .zone-line::before, .zone-line::after{
    content:"";
    position:absolute;
    width:1px; height:8px;
    background:var(--line-thin);
    top:-4px;
  }
  .zone-line::before{ left:0; }
  .zone-line::after{ right:0; }

  .cards{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:16px;
  }

  /* ---------- CARD ---------- */
  .card{
    background:var(--panel-navy);
    border:1px solid var(--line-thin);
    border-radius:3px;
    padding:20px 20px 16px;
    display:flex;
    flex-direction:column;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    position:relative;
  }
  .card:hover{
    background:var(--panel-navy-hover);
    border-color: var(--copper);
    transform: translateY(-2px);
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
  }

  .card h3{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:16px;
    font-weight:700;
    color:var(--paper);
    margin:0;
    line-height:1.5;
  }

  .audience{
    flex-shrink:0;
    font-family:"IBM Plex Mono", monospace;
    font-size:10px;
    color:var(--copper-bright);
    border:1px solid var(--copper);
    padding:3px 7px 2px;
    border-radius:2px;
    white-space:nowrap;
    letter-spacing:0.02em;
  }

  .desc{
    font-size:13.5px;
    color:var(--paper-dim);
    line-height:1.75;
    margin:0 0 12px;
  }

  .hint{
    font-size:12.5px;
    color:var(--muted-blue);
    line-height:1.7;
    margin:0 0 16px;
    padding-left:12px;
    border-left:2px solid var(--gold);
  }
  .hint b{ color:var(--gold); font-weight:500; }

  .card-footer{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:12px;
    border-top:1px solid var(--line-thin);
  }

  .slug{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    color:var(--muted-blue);
    letter-spacing:0.02em;
  }

  .open-btn{
    font-family:"Noto Sans JP", sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bg-navy);
    background:var(--copper-bright);
    padding:7px 14px;
    border-radius:2px;
    text-decoration:none;
    transition: background 0.15s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .open-btn:hover{ background:var(--gold); }
  .open-btn::after{ content:"→"; }

  .note-pill{
    display:inline-block;
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    color:var(--gold);
    margin-top:2px;
  }

  .empty-msg{
    color:var(--muted-blue);
    font-size:13px;
    padding:24px 4px;
    display:none;
  }

  /* ---------- FOOTER TITLE BLOCK ---------- */
  footer{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid var(--line-thin);
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    justify-content:space-between;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color:var(--muted-blue);
  }
  footer .k{ color:var(--copper-bright); }

  @media (max-width: 719px){
    .head-figure{ display:none; }
    .title-block{ right:32px; }
  }

  @media (max-width: 600px){
    header{ padding:28px 20px; }
    .wrap{ padding: 32px 16px 24px; }
  }
</style>
</head>

    ]

const zonesEl = document.getElementById('zones');
const searchEl = document.getElementById('search');
const resultCountEl = document.getElementById('resultCount');
const emptyMsgEl = document.getElementById('emptyMsg');

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cardHtml(tool){
  return `
    <div class="card" data-search="${escapeHtml((tool.name + ' ' + tool.audience + ' ' + tool.desc).toLowerCase())}">
      <div class="card-top">
        <h3>${escapeHtml(tool.name)}</h3>
        <span class="audience">${escapeHtml(tool.audience)}</span>
      </div>
      <p class="desc">${escapeHtml(tool.desc)}</p>
      <p class="hint">${tool.hint}</p>
      ${tool.note ? `<span class="note-pill">${escapeHtml(tool.note)}</span>` : ''}
      <div class="card-footer">
        <span class="slug">${escapeHtml(tool.slug)}</span>
        <a class="open-btn" href="${tool.url}" target="_blank" rel="noopener">開く</a>
      </div>
    </div>
  `;
}

function zoneHtml(zone){
  const cards = zone.tools.map(cardHtml).join('');
  return `
    <div class="zone" data-zone="${zone.code}">
      <div class="zone-divider">
        <span class="zone-tag">ZONE ${zone.code}</span>
        <span class="zone-title">${escapeHtml(zone.title)}</span>
        <span class="zone-line"></span>
      </div>
      <div class="cards">${cards}</div>
    </div>
  `;
}

function render(){
  zonesEl.innerHTML = ZONES.map(zoneHtml).join('');
}

function totalToolCount(){
  return ZONES.reduce((sum, z) => sum + z.tools.length, 0);
}

function filter(){
  const q = searchEl.value.trim().toLowerCase();
  const cards = zonesEl.querySelectorAll('.card');
  let visibleCount = 0;

  cards.forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });

  zonesEl.querySelectorAll('.zone').forEach(zone => {
    const anyVisible = Array.from(zone.querySelectorAll('.card')).some(c => c.style.display !== 'none');
    zone.style.display = anyVisible ? '' : 'none';
  });

  if(q){
    resultCountEl.textContent = `${visibleCount} / ${totalToolCount()} 件`;
  } else {
    resultCountEl.textContent = `全 ${totalToolCount()} 件`;
  }
  emptyMsgEl.style.display = visibleCount === 0 ? 'block' : 'none';
}

render();
filter();
searchEl.addEventListener('input', filter);
</script>
